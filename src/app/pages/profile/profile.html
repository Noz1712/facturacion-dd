<mat-card class="profile-card" appearance="outlined">
  <div class="profile-header">
    <div>
      <p class="section-label">Empresa</p>
      <h2>Perfil de empresa</h2>
      <p class="account-copy">Cuenta: {{ user()?.email || 'Sin correo' }}</p>
    </div>
    @if (loading()) {
      <mat-spinner diameter="24" />
    } @else {
      <mat-icon>business</mat-icon>
    }
  </div>

  <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Responsable (opcional)</mat-label>
      <input matInput formControlName="manager" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telefono</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Plazo de pago (dias)</mat-label>
      <input matInput type="number" min="0" step="1" formControlName="paymentTermDays" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Direccion</mat-label>
      <textarea matInput rows="3" formControlName="address"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripcion</mat-label>
      <textarea matInput rows="5" formControlName="description"></textarea>
    </mat-form-field>

    <button mat-flat-button type="submit" class="save-button">
      Guardar datos
    </button>
  </form>
</mat-card>
